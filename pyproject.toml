[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schedbot"
version = "0.1.0"
description = "AI-powered scheduling and appointment-management engine — bookings, confirmations, reminders, waitlist"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "SchedBot contributors" },
]

dependencies = [
    # AI / LLM
    "anthropic>=0.30.0",

    # HTTP
    "httpx>=0.27.0",

    # Data handling
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # Database
    "aiosqlite>=0.20.0",

    # Email sending fallback
    "aiosmtplib>=3.0.0",

    # Google Calendar (optional secondary integration)
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",

    # MCP server
    "mcp>=1.0.0",

    # Config & env
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",

    # Utilities
    "rich>=13.7.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# Twilio is the only optional outbound channel a deployment might not want.
sms = [
    "twilio>=9.0.0",
]

[project.scripts]
nova = "schedbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schedbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Treat DeprecationWarning as an error so we never silently regress on
# python-stdlib deprecations (e.g. datetime.utcnow). When a third-party
# library starts emitting a deprecation we can't fix at our layer, add a
# narrow `"ignore:<message regex>:DeprecationWarning:<module>"` line below
# rather than relaxing the global rule.
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
